<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Success</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .success-box {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #28a745;
            margin: auto;
            position: relative;

            animation: pop 0.5s ease-in-out;
        }

        .checkmark::after {
            content: "";
            position: absolute;

            width: 25px;
            height: 50px;

            border-right: 8px solid white;
            border-bottom: 8px solid white;

            transform: rotate(45deg);

            left: 35px;
            top: 18px;

            animation: tick 0.5s ease-in-out 0.3s forwards;

            opacity: 0;
        }

        h1 {
            margin-top: 25px;
            color: #28a745;
        }

        p {
            margin-top: 10px;
            color: #666;
        }

        @keyframes pop {

            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes tick {

            0% {
                opacity: 0;
                transform: rotate(45deg) scale(0);
            }

            100% {
                opacity: 1;
                transform: rotate(45deg) scale(1);
            }
        }

    </style>
</head>

<body>

    <div class="success-box">

        <div class="checkmark"></div>

        <h1>Success!</h1>

        <p>Student added successfully</p>

        <p>Redirecting...</p>

    </div>


    <script>

        setTimeout(function() {

            window.location.href = "{% url 'student' %}";

        }, 3000);

    </script>

</body>
</html>
