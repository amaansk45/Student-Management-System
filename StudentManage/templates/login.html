{% extends "base.html" %}
{% block start %}

<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white w-full max-w-md rounded-xl shadow-xl p-8">

        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-500 rounded-full mx-auto flex items-center justify-center text-white text-2xl">
                🎓
            </div>
            <h2 class="text-3xl font-bold mt-4">EduManage AI</h2>
            <p class="text-gray-500 text-sm">Student Management System</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-100 text-red-700 p-3 rounded mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block mb-1 font-medium">Username</label>
                <input type="text" name="username"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-4">
                <label class="block mb-1 font-medium">Password</label>
                <input type="password" name="password"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                Sign In
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            Don't have an account?
            <a href="{% url 'register_page' %}" class="text-blue-600 font-semibold">
                Sign Up
            </a>
        </p>

    </div>
</div>

{% endblock %}
