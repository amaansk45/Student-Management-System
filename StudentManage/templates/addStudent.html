{% extends "base.html" %}
{% block start %}

<div class="min-h-screen bg-slate-100 py-10 px-4">

    <!-- Header -->
    <div class="max-w-4xl mx-auto mb-8">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-8 text-white shadow-lg">
            <h1 class="text-3xl font-bold">Add New Student</h1>
            <p class="mt-2 text-blue-100">
                Fill in the student details below to add a new record.
            </p>
        </div>
    </div>

    <!-- Form Card -->
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">

        <div class="p-8">

            <form method="POST">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Name -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Student Name
                        </label>
                        <input
                            type="text"
                            name="name"
                            placeholder="Enter student name"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Email Address
                        </label>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter email"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Phone Number
                        </label>
                        <input
                            type="text"
                            name="phone"
                            placeholder="Enter phone number"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                    </div>

                    <!-- Course -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Course
                        </label>

                        <select
                            name="course"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                            <option>Select Course</option>
                            <option>BCA</option>
                            <option>MCA</option>
                            <option>B.Tech</option>
                            <option>M.Tech</option>
                            <option>B.Sc</option>
                        </select>
                    </div>

                    <!-- Age -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Age
                        </label>
                        <input
                            type="number"
                            name="age"
                            placeholder="Enter age"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                    </div>

                    <!-- Status -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Status
                        </label>

                        <select
                            name="status"
                            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        >
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="flex justify-end gap-4 mt-8">

                    <a href="{% url 'student' %}"
                       class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 transition">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition shadow-md"
                    >
                        Save Student
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
