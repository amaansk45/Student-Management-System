{% extends "base.html" %}

{% block start %}

<div class="container-fluid bg-light min-vh-100 p-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold text-primary">
                <i class="bi bi-person-plus-fill"></i>
                Add Student
            </h2>

            <p class="text-muted mb-0">
                Add a new student to the system
            </p>
        </div>

        <a href="{% url 'student' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Back to Students
        </a>

    </div>


    <!-- Form Card -->
    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0">
                        <i class="bi bi-person-vcard"></i>
                        Student Information
                    </h5>
                </div>


                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-3">

                            <!-- Full Name -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter student name"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter email"
                                    required
                                >

                            </div>


                            <!-- Phone -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="Enter phone number"
                                    required
                                >

                            </div>


                            <!-- Age -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    name="age"
                                    class="form-control"
                                    placeholder="Enter age"
                                    required
                                >

                            </div>


                            <!-- Course -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Course
                                </label>

                                <select
                                    name="course"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select Course
                                    </option>

                                    <option value="MCA">
                                        MCA
                                    </option>

                                    <option value="BCA">
                                        BCA
                                    </option>

                                    <option value="B.Tech">
                                        B.Tech
                                    </option>

                                    <option value="MBA">
                                        MBA
                                    </option>

                                </select>

                            </div>

                            <!-- Status -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                >

                                    <option value="active">
                                        Active
                                    </option>

                                    <option value="inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>


                            <!-- Submit Buttons -->
                            <div class="col-12 mt-4">

                                <hr>

                                <div class="d-flex justify-content-end gap-2">

                                    <a
                                        href="{% url 'student' %}"
                                        class="btn btn-secondary"
                                    >
                                        Cancel
                                    </a>

                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        <i class="bi bi-check-circle"></i>
                                        Add Student
                                    </button>

                                </div>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
